app-id: ch.proton.drive
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet9
command: ProtonDrive
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=~/ProtonDrive:create
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --own-name=ch.proton.drive

build-options:
  append-path: /usr/lib/sdk/dotnet9/bin
  append-ld-library-path: /usr/lib/sdk/dotnet9/lib
  env:
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/lib/sdk/dotnet9/lib/pkgconfig

modules:
  - name: proton-drive
    buildsystem: simple
    build-commands:
      - dotnet publish src/ProtonDrive.App.Linux/ProtonDrive.App.Linux.csproj 
        --configuration Release 
        --runtime linux-x64 
        --self-contained true 
        --output /app/bin
        -p:PublishSingleFile=true
        -p:PublishTrimmed=false
        -p:PublishReadyToRun=false
      - install -Dm644 assets/ProtonDrive.ico /app/share/icons/hicolor/256x256/apps/ch.proton.drive.png
      - install -Dm644 flatpak/ch.proton.drive.desktop /app/share/applications/ch.proton.drive.desktop
      - install -Dm644 flatpak/ch.proton.drive.metainfo.xml /app/share/metainfo/ch.proton.drive.metainfo.xml
    sources:
      - type: dir
        path: .
