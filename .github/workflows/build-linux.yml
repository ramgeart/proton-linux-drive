name: Build and Release Linux

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        
    - name: Restore dependencies
      run: dotnet restore src/ProtonDrive.App.Linux/ProtonDrive.App.Linux.csproj
      continue-on-error: true
      
    - name: Build Linux Application
      run: |
        dotnet publish src/ProtonDrive.App.Linux/ProtonDrive.App.Linux.csproj \
          --configuration Release \
          --runtime linux-x64 \
          --self-contained true \
          --output ./publish/linux-x64 \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=false \
          -p:PublishReadyToRun=false
      continue-on-error: true
      
    - name: Create release archive
      if: success()
      run: |
        cd publish/linux-x64
        zip -r ../../ProtonDrive-linux-x64.zip .
        cd ../..
        
    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ProtonDrive-linux-x64
        path: ProtonDrive-linux-x64.zip
        
  build-flatpak:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Flatpak and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        sudo flatpak install -y flathub org.freedesktop.Platform//24.08
        sudo flatpak install -y flathub org.freedesktop.Sdk//24.08
        sudo flatpak install -y flathub org.freedesktop.Sdk.Extension.dotnet9//24.08
        
    - name: Build Flatpak
      run: |
        flatpak-builder --user --install --force-clean \
          build-dir flatpak/ch.proton.drive.yml
      continue-on-error: true
      
    - name: Export Flatpak bundle
      if: success()
      run: |
        flatpak build-bundle ~/.local/share/flatpak/repo \
          ProtonDrive.flatpak ch.proton.drive
          
    - name: Upload Flatpak artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ProtonDrive-flatpak
        path: ProtonDrive.flatpak
        
  release:
    needs: [build-linux, build-flatpak]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download Linux build
      uses: actions/download-artifact@v4
      with:
        name: ProtonDrive-linux-x64
        
    - name: Download Flatpak
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ProtonDrive-flatpak
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ProtonDrive-linux-x64.zip
          ProtonDrive.flatpak
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
